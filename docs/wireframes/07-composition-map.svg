<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" role="img" aria-labelledby="ttl desc">
<title id="ttl">Composition space — band gap versus stability</title>
<desc id="desc">A hand-rolled SVG scatter of every scored candidate: energy above hull on the x axis, band gap on the y axis, with the mission's target window drawn as a dashed green rectangle. Scored points are small translucent blue; hits are larger green and rediscoveries amber, both ringed and labelled with their formula.</desc>
<rect width="1240" height="560" fill="#faf7f2"/>
<g font-family="'IBM Plex Sans',ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif" dominant-baseline="middle" fill="#191714">

  <rect x="20" y="20" width="740" height="520" rx="12" fill="#ffffff" stroke="#e8e2d8"/>
  <text x="40" y="46" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#94897a">COMPOSITION SPACE — GAP VS STABILITY</text>

  <rect x="440" y="36" width="124" height="21" rx="6" fill="#f3eee4" stroke="#e8e2d8"/>
  <rect x="442" y="38" width="60" height="17" rx="5" fill="#ffffff" stroke="#ddd5c7"/>
  <text x="472" y="46.5" font-size="9.5" text-anchor="middle">status</text>
  <text x="533" y="46.5" font-size="9.5" fill="#94897a" text-anchor="middle">iteration</text>

  <text x="740" y="39" font-size="9.5" font-weight="600" letter-spacing="0.85" fill="#94897a" text-anchor="end">BEST |GAP−IDEAL|</text>
  <text x="740" y="57" font-size="13" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="end">&lt;0.05 eV&gt;</text>
  <line x1="40" y1="70" x2="740" y2="70" stroke="#eee7da"/>

  <!-- gridlines -->
  <g stroke="#eee7da" stroke-dasharray="2 4">
    <line x1="88" y1="317.5" x2="728" y2="317.5"/>
    <line x1="88" y1="215" x2="728" y2="215"/>
    <line x1="88" y1="112.5" x2="728" y2="112.5"/>
  </g>

  <!-- target window -->
  <rect x="88" y="245.8" width="94.1" height="61.5" fill="#3f6b25" opacity="0.09"/>
  <rect x="88" y="245.8" width="94.1" height="61.5" fill="none" stroke="#3f6b25" stroke-dasharray="4 4" opacity="0.55"/>
  <text x="192" y="252" font-size="9.5" fill="#3f6b25">target window — gap 1.1–1.7 eV, hull ≤ 0.05</text>

  <!-- scored points -->
  <g fill="#1f4fd8" opacity="0.62">
    <circle cx="125.6" cy="179.1" r="5"/><circle cx="200.9" cy="209.9" r="5"/>
    <circle cx="257.4" cy="346.2" r="5"/><circle cx="313.9" cy="220.1" r="5"/>
    <circle cx="351.5" cy="153.5" r="5"/><circle cx="182.1" cy="373.9" r="5"/>
    <circle cx="426.8" cy="274.4" r="5"/><circle cx="483.3" cy="194.5" r="5"/>
    <circle cx="539.8" cy="322.6" r="5"/><circle cx="596.4" cy="240.6" r="5"/>
    <circle cx="652.9" cy="168.8" r="5"/><circle cx="389.2" cy="358.5" r="5"/>
    <circle cx="276.2" cy="133.0" r="5"/><circle cx="219.8" cy="291.9" r="5"/>
    <circle cx="144.5" cy="225.2" r="5"/><circle cx="502.1" cy="312.4" r="5"/>
    <circle cx="615.2" cy="256.0" r="5"/><circle cx="332.7" cy="384.1" r="5"/>
    <circle cx="445.6" cy="122.7" r="5"/><circle cx="558.5" cy="209.9" r="5"/>
    <circle cx="671.6" cy="297.0" r="5"/><circle cx="238.6" cy="261.1" r="5"/>
    <circle cx="295.1" cy="312.4" r="5"/><circle cx="379.8" cy="184.2" r="5"/>
  </g>

  <!-- hit + rediscovery -->
  <circle cx="110.6" cy="245.8" r="6.5" fill="#3f6b25" stroke="#faf7f2" stroke-width="2"/>
  <text x="122" y="238" font-size="10" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#3f6b25">CdCuSe₂</text>
  <circle cx="95.5" cy="281.6" r="6.5" fill="#a87a10" stroke="#faf7f2" stroke-width="2"/>
  <text x="106" y="290" font-size="10" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#a87a10">AlSb</text>

  <!-- legend -->
  <rect x="512" y="99" width="200" height="22" rx="6" fill="#ffffff" opacity="0.86"/>
  <circle cx="524" cy="110" r="4.5" fill="#1f4fd8" opacity="0.62"/>
  <text x="533" y="110" font-size="9.5" fill="#5f594f">scored</text>
  <circle cx="583" cy="110" r="5.5" fill="#3f6b25" stroke="#faf7f2" stroke-width="1.6"/>
  <text x="592" y="110" font-size="9.5" fill="#5f594f">hit</text>
  <circle cx="620" cy="110" r="5.5" fill="#a87a10" stroke="#faf7f2" stroke-width="1.6"/>
  <text x="629" y="110" font-size="9.5" fill="#5f594f">rediscovery</text>

  <!-- axes -->
  <line x1="88" y1="92" x2="88" y2="420" stroke="#e8e2d8"/>
  <line x1="88" y1="420" x2="728" y2="420" stroke="#e8e2d8"/>
  <g font-size="9.5" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#b3a993" text-anchor="middle">
    <text x="88" y="434">0.00</text><text x="182.1" y="434">0.05</text>
    <text x="276.2" y="434">0.10</text><text x="370.3" y="434">0.15</text>
    <text x="464.4" y="434">0.20</text><text x="558.5" y="434">0.25</text>
    <text x="652.6" y="434">0.30</text>
  </g>
  <g font-size="9.5" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#b3a993" text-anchor="end">
    <text x="80" y="420">0</text><text x="80" y="317.5">1</text>
    <text x="80" y="215">2</text><text x="80" y="112.5">3</text>
  </g>
  <text x="408" y="456" font-size="10.5" fill="#94897a" text-anchor="middle">energy above hull (eV/atom)</text>
  <text x="52" y="256" font-size="10.5" fill="#94897a" text-anchor="middle" transform="rotate(-90 52 256)">band gap, HSE fidelity (eV)</text>

  <line x1="40" y1="472" x2="740" y2="472" stroke="#eee7da"/>
  <text x="40" y="492" font-size="10.5" fill="#94897a">&lt;41&gt; scored candidates · &lt;8&gt; iterations · hover a point for formula, gap, hull, iteration</text>

  <!-- annotations -->
  <text x="780" y="46" font-size="10" font-weight="600" letter-spacing="0.85" fill="#94897a">MARK SPEC</text>
  <line x1="780" y1="58" x2="1216" y2="58" stroke="#eee7da"/>
  <g font-size="9" font-weight="600" letter-spacing="0.7" fill="#b3a993">
    <text x="806" y="70">CLASS</text><text x="900" y="70">R</text><text x="930" y="70">FILL</text>
    <text x="1030" y="70">OPACITY</text><text x="1120" y="70">LABEL</text>
  </g>
  <g font-size="9.5" fill="#5f594f">
    <circle cx="792" cy="88" r="5" fill="#1f4fd8" opacity="0.62"/>
    <text x="806" y="88">scored</text><text x="900" y="88">5</text><text x="930" y="88">--scored blue</text>
    <text x="1030" y="88">0.62</text><text x="1120" y="88">—</text>

    <circle cx="792" cy="110" r="6.5" fill="#3f6b25" stroke="#faf7f2" stroke-width="2"/>
    <text x="806" y="110">hit</text><text x="900" y="110">6.5</text><text x="930" y="110">--hit green</text>
    <text x="1030" y="110">1.0 + ring</text><text x="1120" y="110">formula</text>

    <circle cx="792" cy="132" r="6.5" fill="#a87a10" stroke="#faf7f2" stroke-width="2"/>
    <text x="806" y="132">rediscovery</text><text x="900" y="132">6.5</text><text x="930" y="132">--rediscovery</text>
    <text x="1030" y="132">1.0 + ring</text><text x="1120" y="132">formula</text>

    <circle cx="792" cy="154" r="5" fill="#1f4fd8" opacity="0.35"/>
    <text x="806" y="154">iteration mode</text><text x="900" y="154">5</text><text x="930" y="154">blue</text>
    <text x="1030" y="154">0.25 → 0.90</text><text x="1120" y="154">—</text>
  </g>

  <text x="780" y="186" font-size="10" font-weight="600" letter-spacing="0.85" fill="#94897a">RULES</text>
  <line x1="780" y1="198" x2="1216" y2="198" stroke="#eee7da"/>
  <g font-size="10" fill="#5f594f">
    <text x="780" y="216">Hand-rolled SVG — viewBox 0 0 860 480, margins L64 R24 T20 B60,</text>
    <text x="780" y="231">preserveAspectRatio="none" so it fills the card at any width.</text>
    <text x="780" y="256">The segmented control (status / iteration) re-renders the SVG</text>
    <text x="780" y="271">client-side from the cached snapshot — no refetch.</text>
    <text x="780" y="296">Only hits and rediscoveries get text labels, with a 13px vertical</text>
    <text x="780" y="311">collision nudge for clusters; labels flip to the left of the point</text>
    <text x="780" y="326">past 75% of the plot width.</text>
    <text x="780" y="351">Every point carries an SVG &lt;title&gt; — the hover tooltip is native,</text>
    <text x="780" y="366">so it survives JS-less printing and screen readers.</text>
  </g>
  <text x="780" y="396" font-size="10" font-weight="600" letter-spacing="0.85" fill="#94897a">AXES AUTOSCALE</text>
  <line x1="780" y1="408" x2="1216" y2="408" stroke="#eee7da"/>
  <g font-size="10" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#5f594f">
    <text x="780" y="426">xMax = max(0.32, max hull) × 1.06</text>
    <text x="780" y="442">yMax = max(3.2, gap_hi × 1.2, max gap) × 1.05</text>
  </g>
  <g font-size="10" fill="#94897a">
    <text x="780" y="466">The target window is therefore always in frame,</text>
    <text x="780" y="481">even before anything has scored near it.</text>
  </g>
</g>
</svg>
