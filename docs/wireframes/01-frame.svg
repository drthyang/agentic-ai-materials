<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" height="580" role="img" aria-labelledby="ttl desc">
<title id="ttl">Global chrome — header, status bar, page slot, disclaimer, footer</title>
<desc id="desc">The frame shared by all three pages: a header with brand mark, version chip, three page pills and an Export CSV button; a status bar with live dot, message and model chips; the page content slot; a warm-red surrogate-screening disclaimer that is never dismissible; and the footer.</desc>
<rect width="1040" height="580" fill="#faf7f2"/>
<g font-family="'IBM Plex Sans',ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif" dominant-baseline="middle" fill="#191714">

  <!-- header -->
  <rect x="0" y="0" width="1040" height="64" fill="#ffffff"/>
  <line x1="0" y1="64" x2="1040" y2="64" stroke="#e8e2d8"/>

  <rect x="24" y="17" width="30" height="30" rx="9" fill="#1f4fd8"/>
  <g transform="translate(29,22)">
    <polygon points="10,2.4 16.6,6.2 16.6,13.8 10,17.6 3.4,13.8 3.4,6.2" fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.62"/>
    <circle cx="10" cy="10" r="2.1" fill="#ffffff"/>
    <circle cx="10" cy="2.4" r="1.15" fill="#ffffff" opacity="0.55"/>
    <circle cx="16.6" cy="13.8" r="1.15" fill="#ffffff" opacity="0.55"/>
    <circle cx="3.4" cy="13.8" r="1.15" fill="#ffffff" opacity="0.55"/>
  </g>
  <text x="64" y="26" font-size="14" font-weight="700">Athanor — Mission Control</text>
  <text x="64" y="44" font-size="10" fill="#94897a">Closed-loop materials discovery · agent + critic + surrogates</text>

  <rect x="378" y="23" width="40" height="18" rx="5" fill="#f3eee4"/>
  <text x="398" y="32" font-size="9.5" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#5f594f" text-anchor="middle">v0.1</text>
  <line x1="436" y1="16" x2="436" y2="48" stroke="#e8e2d8"/>

  <rect x="456" y="17" width="112" height="30" rx="9" fill="#1f4fd8"/>
  <text x="470" y="32" font-size="10" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#ffffff" opacity="0.6">1</text>
  <text x="484" y="32" font-size="11.5" fill="#ffffff">Campaign</text>
  <text x="590" y="32" font-size="10" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#b3a993">2</text>
  <text x="604" y="32" font-size="11.5" fill="#5f594f">Benchmark</text>
  <text x="716" y="32" font-size="10" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#b3a993">3</text>
  <text x="730" y="32" font-size="11.5" fill="#5f594f">Notebook</text>

  <rect x="904" y="17" width="112" height="30" rx="9" fill="#ffffff" stroke="#ddd5c7"/>
  <text x="960" y="32" font-size="11.5" text-anchor="middle">Export CSV</text>

  <!-- status bar -->
  <rect x="0" y="64" width="1040" height="36" fill="#f7f3ec"/>
  <line x1="0" y1="100" x2="1040" y2="100" stroke="#e8e2d8"/>
  <circle cx="32" cy="82" r="8" fill="#1f4fd8" opacity="0.16"/>
  <circle cx="32" cy="82" r="4" fill="#1f4fd8"/>
  <text x="48" y="82" font-size="10" font-weight="600" letter-spacing="0.85" fill="#94897a">STATUS</text>
  <text x="98" y="82" font-size="11.5" fill="#191714">Iteration <tspan font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f4fd8">&lt;8&gt;</tspan> of <tspan font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f4fd8">&lt;12&gt;</tspan> · running · last activity <tspan font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1f4fd8">&lt;14:06:15&gt;</tspan> UTC</text>

  <g font-size="9.5" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">
    <rect x="646" y="73" width="112" height="18" rx="5" fill="#f3eee4"/>
    <text x="702" y="82" fill="#5f594f">agent <tspan fill="#1f4fd8">&lt;qwen3:32b&gt;</tspan></text>
    <rect x="766" y="73" width="118" height="18" rx="5" fill="#f3eee4"/>
    <text x="825" y="82" fill="#5f594f">critic <tspan fill="#1f4fd8">&lt;gemma4:26b&gt;</tspan></text>
    <rect x="892" y="73" width="124" height="18" rx="5" fill="#f3eee4"/>
    <text x="954" y="82" fill="#5f594f">refreshed <tspan fill="#1f4fd8">&lt;14:06&gt;</tspan> UTC</text>
  </g>

  <!-- page content slot -->
  <rect x="24" y="116" width="992" height="330" rx="12" fill="#fffdf9" stroke="#ddd5c7" stroke-dasharray="6 5"/>
  <text x="520" y="252" font-size="13" fill="#94897a" text-anchor="middle">page content — §2 Campaign · §4 Benchmark · §5 Notebook</text>
  <g font-size="10.5" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#b3a993" text-anchor="middle">
    <text x="520" y="282">main · max-width 1480px · padding 16px 24px 24px · grid 3 × 1fr · gap 14px</text>
    <text x="520" y="302">.span2 → grid-column: span 2   ·   .span3 → grid-column: span 3</text>
    <text x="520" y="322">@media (max-width: 980px) → single column, span2/span3 collapse</text>
  </g>

  <!-- disclaimer -->
  <rect x="0" y="470" width="1040" height="52" fill="#fdf0ea"/>
  <line x1="0" y1="470" x2="1040" y2="470" stroke="#f2cdbb"/>
  <line x1="0" y1="522" x2="1040" y2="522" stroke="#f2cdbb"/>
  <text x="24" y="496" font-size="13" fill="#a03415">⚠</text>
  <g font-size="11.5" fill="#a03415">
    <text x="44" y="488">Surrogate screening only — CHGNet relaxations and MEGNet band gaps (HSE fidelity).</text>
    <text x="44" y="506">Candidates are leads, not discoveries: validate with DFT before any experimental claim.</text>
  </g>

  <text x="520" y="548" font-size="10" fill="#b3a993" text-anchor="middle">Athanor · read-only view of the campaign DB, lab notebook, and mission config · auto-refreshes every 10 s</text>
</g>
</svg>
