<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 800" width="1140" height="800" role="img" aria-labelledby="ttl desc">
<title id="ttl">States — cold start, running vs idle, server unreachable, recorded mode</title>
<desc id="desc">Every panel's explicit empty state before a campaign has run; the signals that differ between a running and an idle campaign; the degraded status bar when the server cannot be reached; and the single warm chip that marks a recorded, statically exported campaign.</desc>
<rect width="1140" height="800" fill="#faf7f2"/>
<g font-family="'IBM Plex Sans',ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif" dominant-baseline="middle" fill="#191714">

  <!-- 6.1 cold start -->
  <text x="20" y="32" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#94897a">6.1  COLD START — NO CAMPAIGN YET</text>
  <rect x="20" y="44" width="1100" height="32" rx="8" fill="#f7f3ec" stroke="#e8e2d8"/>
  <circle cx="40" cy="60" r="4" fill="#b3a993"/>
  <text x="56" y="60" font-size="10" font-weight="600" letter-spacing="0.85" fill="#94897a">STATUS</text>
  <text x="106" y="60" font-size="11.5" fill="#5f594f">no campaign data yet — start one with <tspan font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace">athanor run</tspan></text>

  <g fill="#ffffff" stroke="#e8e2d8">
    <rect x="20" y="88" width="356" height="64" rx="12"/>
    <rect x="392" y="88" width="356" height="64" rx="12"/>
    <rect x="764" y="88" width="356" height="64" rx="12"/>
    <rect x="20" y="164" width="1100" height="52" rx="12"/>
    <rect x="20" y="228" width="734" height="64" rx="12"/>
    <rect x="764" y="228" width="356" height="64" rx="12"/>
    <rect x="20" y="304" width="734" height="64" rx="12"/>
    <rect x="764" y="304" width="356" height="64" rx="12"/>
  </g>
  <g font-size="10" font-weight="600" letter-spacing="0.85" fill="#94897a">
    <text x="36" y="108">MISSION</text>
    <text x="408" y="108">CAMPAIGN</text>
    <text x="780" y="108">AGENT &amp; CRITIC</text>
    <text x="36" y="184">DISCOVERY LOOP</text>
    <text x="36" y="248">COMPOSITION SPACE</text>
    <text x="780" y="248">AGENT FEED</text>
    <text x="36" y="324">TOP CANDIDATES</text>
    <text x="780" y="324">LAB NOTEBOOK</text>
  </g>
  <g font-size="10" fill="#b3a993">
    <text x="36" y="126">still fully populated — the mission</text>
    <text x="36" y="140">exists in config before any run</text>
    <text x="408" y="126">0 / 12 iterations, empty meter,</text>
    <text x="408" y="140">every counter at zero</text>
    <text x="780" y="126">models are known before the</text>
    <text x="780" y="140">first call is ever made</text>
    <text x="36" y="202">no iterations yet — the loop appears here live</text>
    <text x="36" y="268">no scored candidates yet          (caption hidden)</text>
    <text x="780" y="268">no events yet          (chip hidden)</text>
    <text x="36" y="344">no data yet          (a single colspan=6 row)</text>
    <text x="780" y="344">no entries yet</text>
  </g>
  <text x="20" y="392" font-size="10.5" fill="#94897a">Every panel has an explicit empty state and none of them is a spinner — the dashboard is usable, and honest, before a single candidate exists.</text>

  <!-- 6.2 running vs idle -->
  <text x="20" y="426" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#94897a">6.2  RUNNING VS IDLE</text>
  <g font-size="9.5" font-weight="600" letter-spacing="0.8" fill="#b3a993">
    <text x="20" y="448">SIGNAL</text><text x="280" y="448">RUNNING</text><text x="740" y="448">IDLE</text>
  </g>
  <line x1="20" y1="458" x2="1120" y2="458" stroke="#eee7da"/>
  <g font-size="10.5" fill="#5f594f">
    <text x="20" y="476">Status dot</text>
    <text x="280" y="476">blue, 1.6 s pulse (suppressed under prefers-reduced-motion)</text>
    <text x="740" y="476">grey, static</text>
    <text x="20" y="498">Status message</text>
    <text x="280" y="498">Iteration 8 of 12 · running · last activity …</text>
    <text x="740" y="498">… · idle · …</text>
    <text x="20" y="520">Mission pill</text>
    <text x="280" y="520">● running (blue tint)</text>
    <text x="740" y="520">○ idle (dim)</text>
    <text x="20" y="542">Evaluate stage</text>
    <text x="280" y="542">.active — blue tint, blue ink</text>
    <text x="740" y="542">plain</text>
    <text x="20" y="564">Loopback tail</text>
    <text x="280" y="564">next: iteration 9 / 12</text>
    <text x="740" y="564">campaign complete, once done ≥ planned</text>
  </g>
  <g stroke="#eee7da">
    <line x1="20" y1="487" x2="1120" y2="487"/>
    <line x1="20" y1="509" x2="1120" y2="509"/>
    <line x1="20" y1="531" x2="1120" y2="531"/>
    <line x1="20" y1="553" x2="1120" y2="553"/>
  </g>

  <!-- 6.3 unreachable -->
  <text x="20" y="600" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#94897a">6.3  SERVER UNREACHABLE</text>
  <rect x="20" y="612" width="1100" height="32" rx="8" fill="#f7f3ec" stroke="#e8e2d8"/>
  <circle cx="40" cy="628" r="4" fill="#b3a993"/>
  <text x="56" y="628" font-size="10" font-weight="600" letter-spacing="0.85" fill="#94897a">STATUS</text>
  <text x="106" y="628" font-size="11.5" fill="#5f594f">dashboard server unreachable — retrying…</text>
  <text x="20" y="662" font-size="10.5" fill="#94897a">A fetch failure leaves the last-rendered content in place and degrades only the status bar — a dropped poll must never blank a chart you were reading.</text>

  <!-- 6.4 recorded -->
  <text x="20" y="700" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#94897a">6.4  RECORDED (STATIC) MODE</text>
  <g font-size="9.5" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">
    <rect x="20" y="714" width="124" height="20" rx="5" fill="#f3eee4"/>
    <text x="82" y="724" fill="#5f594f">agent qwen3:32b</text>
    <rect x="152" y="714" width="132" height="20" rx="5" fill="#f3eee4"/>
    <text x="218" y="724" fill="#5f594f">critic gemma4:26b</text>
    <rect x="292" y="714" width="242" height="20" rx="5" fill="#faf3e3" stroke="#e8d9ae"/>
    <text x="413" y="724" fill="#6b5310">recorded campaign · exported 2026-07-18</text>
  </g>
  <g font-size="10.5" fill="#94897a">
    <text x="20" y="754">export-pages bakes data/snapshot.json + data/benchmark.json. On first load the client tries api/snapshot, falls back to the baked file, and</text>
    <text x="20" y="770">cancels the 10 s timer — a recording never changes. The only visual difference is that one chip, deliberately in the warm "note" colour.</text>
  </g>
</g>
</svg>
