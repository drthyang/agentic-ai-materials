<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="ttl desc">
<title id="ttl">Lab notebook panel</title>
<desc id="desc">The last four notebook entries, newest first, each clamped to three lines and marked with a coloured left border encoding its type: hypothesis, decision, reflection, observation or report.</desc>
<defs>
<linearGradient id="nbfade" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
</linearGradient>
</defs>
<rect width="900" height="380" fill="#faf7f2"/>
<g font-family="'IBM Plex Sans',ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif" dominant-baseline="middle" fill="#191714">

  <rect x="24" y="24" width="420" height="332" rx="12" fill="#ffffff" stroke="#e8e2d8"/>
  <text x="44" y="50" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#94897a">LAB NOTEBOOK</text>
  <rect x="290" y="38" width="134" height="22" rx="7" fill="none" stroke="#ddd5c7"/>
  <text x="357" y="49" font-size="9.5" fill="#1f4fd8" text-anchor="middle">Open full notebook</text>
  <line x1="44" y1="70" x2="424" y2="70" stroke="#eee7da"/>

  <g>
    <rect x="44" y="82" width="3" height="62" rx="1.5" fill="#1f4fd8"/>
    <rect x="44" y="158" width="3" height="62" rx="1.5" fill="#3f6b25"/>
    <rect x="44" y="234" width="3" height="62" rx="1.5" fill="#a87a10"/>
    <rect x="44" y="310" width="3" height="46" rx="1.5" fill="#94897a"/>
  </g>

  <g font-size="8.5" text-anchor="middle">
    <rect x="58" y="82" width="68" height="17" rx="5" fill="#eaf0fe" stroke="#b9c6f4"/><text x="92" y="90.5" fill="#1f4fd8">hypothesis</text>
    <rect x="58" y="158" width="66" height="17" rx="5" fill="#eff5ea" stroke="#d3e2c4"/><text x="91" y="166.5" fill="#3f6b25">reflection</text>
    <rect x="58" y="234" width="62" height="17" rx="5" fill="#faf3e3" stroke="#e8d9ae"/><text x="89" y="242.5" fill="#a87a10">decision</text>
    <rect x="58" y="310" width="76" height="17" rx="5" fill="#f3eee4"/><text x="96" y="318.5" fill="#5f594f">observation</text>
  </g>

  <g font-size="9" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#b3a993" text-anchor="end">
    <text x="424" y="90.5">iter 8 · 13:58</text>
    <text x="424" y="166.5">iter 7 · 13:41</text>
    <text x="424" y="242.5">iter 7 · 13:36</text>
    <text x="424" y="318.5">iter 6 · 13:12</text>
  </g>

  <g font-size="10" fill="#5f594f">
    <text x="58" y="112">Chalcopyrite Cu–In–Se derivatives should land</text>
    <text x="58" y="126">near 1.3 eV if the Ga fraction stays under a</text>
    <text x="58" y="140">third — worth two relaxations this iteration.</text>

    <text x="58" y="188">Two of three vetoes were right: the Sn-rich</text>
    <text x="58" y="202">family sits 0.2 eV above the window. Push</text>
    <text x="58" y="216">Cd-for-Zn next, where both hits came from.</text>

    <text x="58" y="264">Spend what is left of the relaxation budget</text>
    <text x="58" y="278">on Cd-for-Zn substitutions only; the Sn</text>
    <text x="58" y="292">branch is closed for this campaign.</text>

    <text x="58" y="340">AlSb reduced formula matches a hold-out</text>
    <text x="58" y="354">entry — flagged rediscovery, not a hit.</text>
  </g>
  <rect x="26" y="326" width="416" height="28" rx="10" fill="url(#nbfade)"/>

  <!-- annotations -->
  <text x="470" y="50" font-size="10" font-weight="600" letter-spacing="0.85" fill="#94897a">LEFT BORDER ENCODES TYPE</text>
  <line x1="470" y1="62" x2="876" y2="62" stroke="#eee7da"/>
  <g>
    <rect x="470" y="70" width="3" height="14" rx="1.5" fill="#1f4fd8"/>
    <rect x="470" y="92" width="3" height="14" rx="1.5" fill="#a87a10"/>
    <rect x="470" y="114" width="3" height="14" rx="1.5" fill="#3f6b25"/>
    <rect x="470" y="136" width="3" height="14" rx="1.5" fill="#94897a"/>
    <rect x="470" y="158" width="3" height="14" rx="1.5" fill="#b3a993"/>
  </g>
  <g font-size="10" fill="#5f594f">
    <text x="486" y="77">hypothesis — what the agent expects, and why</text>
    <text x="486" y="99">decision — what it chose to spend budget on</text>
    <text x="486" y="121">reflection — what the last iteration taught it</text>
    <text x="486" y="143">observation — something noticed, not yet acted on</text>
    <text x="486" y="165">report — the end-of-campaign summary</text>
  </g>

  <text x="470" y="196" font-size="10" font-weight="600" letter-spacing="0.85" fill="#94897a">BEHAVIOUR</text>
  <line x1="470" y1="208" x2="876" y2="208" stroke="#eee7da"/>
  <g font-size="10" fill="#5f594f">
    <text x="470" y="226">Last four entries, newest first, each clamped to three lines with</text>
    <text x="470" y="241">-webkit-line-clamp; the panel keeps its own scroll.</text>
    <text x="470" y="266">( Open full notebook ) is a ghost button that programmatically clicks</text>
    <text x="470" y="281">the ③ Notebook pill — one destination, one implementation.</text>
  </g>
  <g font-size="10" fill="#94897a">
    <text x="470" y="312">The notebook is the agent's only cross-iteration memory: every</text>
    <text x="470" y="327">iteration starts from a fresh message list and reads this back. That</text>
    <text x="470" y="342">makes this panel the scientific record, not a log view.</text>
  </g>
</g>
</svg>
