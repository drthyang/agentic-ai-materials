<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 592" width="1140" height="592" role="img" aria-labelledby="ttl desc">
<title id="ttl">Page 2 — Benchmark</title>
<desc id="desc">A single full-width card comparing the agent against the random and greedy-similarity baselines at equal relaxation budget, with the shared hit definition spelled out beneath the table and the matplotlib plot embedded below it.</desc>
<rect width="1140" height="592" fill="#faf7f2"/>
<g font-family="'IBM Plex Sans',ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif" dominant-baseline="middle" fill="#191714">

  <rect x="20" y="20" width="1100" height="480" rx="12" fill="#ffffff" stroke="#e8e2d8"/>
  <text x="40" y="46" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#94897a">BENCHMARK — &lt;2026-07-07 PV ABSORBER&gt;</text>
  <rect x="920" y="36" width="180" height="20" rx="5" fill="#f3eee4"/>
  <text x="1010" y="46" font-size="9" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#5f594f" text-anchor="middle">100 relaxations / strategy</text>
  <line x1="40" y1="64" x2="1100" y2="64" stroke="#eee7da"/>

  <g font-size="9.5" font-weight="600" letter-spacing="0.8" fill="#94897a">
    <text x="40" y="84">STRATEGY</text>
    <text x="300" y="84" text-anchor="end">HITS</text>
    <text x="500" y="84" text-anchor="end">HITS / 100 RELAX</text>
    <text x="700" y="84" text-anchor="end">REDISCOVERIES</text>
    <text x="900" y="84" text-anchor="end">BEST |GAP−IDEAL|</text>
  </g>
  <line x1="40" y1="98" x2="1100" y2="98" stroke="#eee7da"/>

  <rect x="34" y="104" width="1072" height="28" rx="6" fill="#eaf0fe"/>
  <g font-size="11.5">
    <text x="40" y="118" font-weight="700" fill="#1f4fd8">agent</text>
    <text x="40" y="146">similarity</text>
    <text x="40" y="174">random</text>
  </g>
  <g font-size="11.5" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="end">
    <g fill="#1f4fd8" font-weight="700">
      <text x="300" y="118">3</text><text x="500" y="118">3.0</text>
      <text x="700" y="118">1</text><text x="900" y="118">0.05</text>
    </g>
    <text x="300" y="146">1</text><text x="500" y="146">1.0</text>
    <text x="700" y="146">0</text><text x="900" y="146">0.31</text>
    <text x="300" y="174">0</text><text x="500" y="174">0.0</text>
    <text x="700" y="174">0</text><text x="900" y="174">0.62</text>
  </g>
  <line x1="40" y1="160" x2="1100" y2="160" stroke="#eee7da"/>

  <text x="40" y="204" font-size="10" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#94897a">hit = converged · gap in window · hull ≤ max · not confirmed-known</text>

  <!-- embedded plot -->
  <rect x="40" y="228" width="1060" height="240" rx="9" fill="#fffdf9" stroke="#e8e2d8"/>
  <line x1="100" y1="430" x2="1060" y2="430" stroke="#e8e2d8"/>
  <g stroke="#eee7da" stroke-dasharray="2 4">
    <line x1="100" y1="370" x2="1060" y2="370"/>
    <line x1="100" y1="310" x2="1060" y2="310"/>
    <line x1="100" y1="250" x2="1060" y2="250"/>
  </g>
  <g font-size="9.5" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#b3a993" text-anchor="end">
    <text x="92" y="430">0</text><text x="92" y="370">1</text>
    <text x="92" y="310">2</text><text x="92" y="250">3</text>
  </g>
  <rect x="245" y="250" width="120" height="180" rx="3" fill="#1f4fd8"/>
  <rect x="510" y="370" width="120" height="60" rx="3" fill="#94897a"/>
  <rect x="775" y="426" width="120" height="4" rx="2" fill="#b3a993"/>
  <g font-size="10.5" text-anchor="middle">
    <text x="305" y="444" fill="#5f594f">agent</text>
    <text x="570" y="444" fill="#5f594f">similarity</text>
    <text x="835" y="444" fill="#5f594f">random</text>
  </g>
  <text x="72" y="340" font-size="10" fill="#94897a" text-anchor="middle" transform="rotate(-90 72 340)">hits</text>
  <text x="1088" y="458" font-size="9" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#b3a993" text-anchor="end">data/benchmark/&lt;stamp&gt;/benchmark.png</text>

  <text x="40" y="486" font-size="10" fill="#94897a">Columns are read from the JSON, not hard-coded — a new metric in benchmark.py appears here with no UI change.</text>

  <!-- empty state -->
  <text x="20" y="528" font-size="10" font-weight="600" letter-spacing="0.85" fill="#94897a">EMPTY STATE</text>
  <rect x="20" y="540" width="1100" height="34" rx="9" fill="#fffdf9" stroke="#ddd5c7" stroke-dasharray="5 5"/>
  <text x="570" y="557" font-size="10.5" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#94897a" text-anchor="middle">no benchmark run found — produce one with `athanor benchmark`</text>
</g>
</svg>
