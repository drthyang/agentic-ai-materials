<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-labelledby="ttl desc">
<title id="ttl">Responsive layout at 980 pixels and below</title>
<desc id="desc">Below 980 pixels the three-column grid collapses to a single column in source order. The pipeline keeps its 820 pixel minimum width and scrolls horizontally inside its card, as do both tables. Nothing is hidden and nothing reflows into a different reading order.</desc>
<defs>
<linearGradient id="sidefade" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
</linearGradient>
</defs>
<rect width="900" height="700" fill="#faf7f2"/>
<g font-family="'IBM Plex Sans',ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif" dominant-baseline="middle" fill="#191714">

  <rect x="24" y="24" width="380" height="652" rx="14" fill="#faf7f2" stroke="#ddd5c7"/>
  <text x="214" y="12" font-size="9.5" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#b3a993" text-anchor="middle">viewport ≤ 980px</text>

  <!-- header wraps to 2-3 rows -->
  <rect x="32" y="32" width="364" height="52" rx="9" fill="#ffffff" stroke="#e8e2d8"/>
  <rect x="42" y="40" width="18" height="18" rx="5" fill="#1f4fd8"/>
  <text x="68" y="49" font-size="11" font-weight="700">Athanor — Mission Control</text>
  <rect x="42" y="64" width="76" height="15" rx="7" fill="#1f4fd8"/>
  <text x="80" y="71.5" font-size="8.5" fill="#ffffff" text-anchor="middle">1 Campaign</text>
  <text x="130" y="71.5" font-size="8.5" fill="#5f594f">2 Bench</text>
  <text x="180" y="71.5" font-size="8.5" fill="#5f594f">3 Notebook</text>
  <rect x="304" y="62" width="82" height="18" rx="7" fill="#ffffff" stroke="#ddd5c7"/>
  <text x="345" y="71" font-size="8.5" text-anchor="middle">Export CSV</text>

  <rect x="32" y="88" width="364" height="34" rx="9" fill="#f7f3ec" stroke="#e8e2d8"/>
  <circle cx="46" cy="99" r="3.5" fill="#1f4fd8"/>
  <text x="56" y="99" font-size="8.5" font-weight="600" letter-spacing="0.7" fill="#94897a">STATUS</text>
  <text x="98" y="99" font-size="9" fill="#5f594f">Iteration 8 of 12 · running</text>
  <g font-size="8" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">
    <rect x="42" y="106" width="92" height="13" rx="4" fill="#f3eee4"/><text x="88" y="112.5" fill="#5f594f">agent qwen3:32b</text>
    <rect x="140" y="106" width="98" height="13" rx="4" fill="#f3eee4"/><text x="189" y="112.5" fill="#5f594f">critic gemma4:26b</text>
  </g>

  <!-- stacked cards -->
  <g fill="#ffffff" stroke="#e8e2d8">
    <rect x="32" y="130" width="364" height="46" rx="10"/>
    <rect x="32" y="182" width="364" height="46" rx="10"/>
    <rect x="32" y="234" width="364" height="46" rx="10"/>
    <rect x="32" y="286" width="364" height="64" rx="10"/>
    <rect x="32" y="356" width="364" height="90" rx="10"/>
    <rect x="32" y="452" width="364" height="58" rx="10"/>
    <rect x="32" y="516" width="364" height="58" rx="10"/>
    <rect x="32" y="580" width="364" height="52" rx="10"/>
  </g>
  <g font-size="8.5" font-weight="600" letter-spacing="0.7" fill="#94897a">
    <text x="44" y="146">MISSION</text>
    <text x="44" y="198">CAMPAIGN</text>
    <text x="44" y="250">AGENT &amp; CRITIC</text>
    <text x="44" y="302">DISCOVERY LOOP</text>
    <text x="44" y="372">COMPOSITION SPACE</text>
    <text x="44" y="468">AGENT FEED</text>
    <text x="44" y="532">TOP CANDIDATES</text>
    <text x="44" y="596">LAB NOTEBOOK</text>
  </g>

  <!-- pipeline scrolls sideways -->
  <g>
    <rect x="44" y="312" width="66" height="30" rx="6" fill="#fffdf9" stroke="#e8e2d8"/>
    <rect x="122" y="312" width="66" height="30" rx="6" fill="#fffdf9" stroke="#e8e2d8"/>
    <rect x="200" y="312" width="66" height="30" rx="6" fill="#fffdf9" stroke="#e8e2d8"/>
    <rect x="278" y="312" width="66" height="30" rx="6" fill="#eaf0fe" stroke="#b9c6f4"/>
    <rect x="356" y="312" width="36" height="30" rx="6" fill="#fffdf9" stroke="#e8e2d8"/>
    <g stroke="#b3a993">
      <line x1="112" y1="327" x2="120" y2="327"/><line x1="190" y1="327" x2="198" y2="327"/>
      <line x1="268" y1="327" x2="276" y2="327"/><line x1="346" y1="327" x2="354" y2="327"/>
    </g>
    <rect x="332" y="288" width="60" height="60" fill="url(#sidefade)"/>
  </g>

  <!-- mini map -->
  <g>
    <rect x="60" y="384" width="88" height="26" fill="#3f6b25" opacity="0.09"/>
    <g fill="#1f4fd8" opacity="0.62">
      <circle cx="84" cy="396" r="3"/><circle cx="130" cy="418" r="3"/><circle cx="182" cy="390" r="3"/>
      <circle cx="228" cy="410" r="3"/><circle cx="274" cy="382" r="3"/><circle cx="320" cy="404" r="3"/>
      <circle cx="352" cy="424" r="3"/><circle cx="200" cy="428" r="3"/>
    </g>
    <circle cx="72" cy="392" r="4" fill="#3f6b25" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="96" cy="404" r="4" fill="#a87a10" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="60" y1="434" x2="384" y2="434" stroke="#e8e2d8"/>
    <text x="222" y="440" font-size="7.5" fill="#b3a993" text-anchor="middle">SVG scales · min-height 380px</text>
  </g>

  <!-- table scrolls sideways -->
  <g font-size="8" fill="#5f594f">
    <text x="44" y="548">CdCuSe₂      1.70      0.003      3      ● hit · novel</text>
    <text x="44" y="562">AlSb         1.62      0.000      6      ◆ rediscovery</text>
  </g>
  <rect x="330" y="538" width="64" height="34" fill="url(#sidefade)"/>

  <rect x="32" y="638" width="364" height="30" rx="9" fill="#fdf0ea" stroke="#f2cdbb"/>
  <text x="44" y="653" font-size="8" fill="#a03415">⚠ Surrogate screening only — candidates are leads, not discoveries.</text>

  <!-- annotations -->
  <text x="440" y="46" font-size="10" font-weight="600" letter-spacing="0.85" fill="#94897a">≤ 980px — SINGLE COLUMN</text>
  <line x1="440" y1="58" x2="876" y2="58" stroke="#eee7da"/>
  <g font-size="10.5" fill="#5f594f">
    <text x="440" y="78">Source order is preserved: span2 and span3 collapse to</text>
    <text x="440" y="93">span 1 and every card stacks in the order it appears in</text>
    <text x="440" y="108">index.html. Nothing reflows into a different reading order.</text>
    <text x="440" y="138">The header and status bar are flex-wrap: wrap, so they</text>
    <text x="440" y="153">reflow onto two or three rows rather than clipping.</text>
  </g>

  <text x="440" y="190" font-size="10" font-weight="600" letter-spacing="0.85" fill="#94897a">WHAT SCROLLS INSTEAD OF SHRINKING</text>
  <line x1="440" y1="202" x2="876" y2="202" stroke="#eee7da"/>
  <g font-size="10.5" fill="#5f594f">
    <text x="440" y="222">Discovery loop — keeps min-width 820px, stages stay 118px</text>
    <text x="440" y="237">wide and .pipe-scroll takes the horizontal scroll.</text>
    <text x="440" y="262">Top candidates and the benchmark table — .tbl-scroll,</text>
    <text x="440" y="277">same rule: scroll sideways rather than crush a column.</text>
    <text x="440" y="302">Composition map — the only element that genuinely scales:</text>
    <text x="440" y="317">preserveAspectRatio="none" with a 380px min-height floor.</text>
  </g>

  <text x="440" y="354" font-size="10" font-weight="600" letter-spacing="0.85" fill="#94897a">THE RULE</text>
  <line x1="440" y1="366" x2="876" y2="366" stroke="#eee7da"/>
  <g font-size="10.5" fill="#94897a">
    <text x="440" y="386">No content is hidden at any width. A responsive rule that</text>
    <text x="440" y="401">drops a column would quietly drop evidence — so narrow</text>
    <text x="440" y="416">viewports pay in scrolling, never in information.</text>
  </g>
</g>
</svg>
