<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="ttl desc">
<title id="ttl">Campaign card</title>
<desc id="desc">The campaign card: four counters in a two-by-two grid — iterations, proposed, scored and hits — with hits the only stat that takes colour, above a relaxation-budget meter and an error count.</desc>
<rect width="900" height="300" fill="#faf7f2"/>
<g font-family="'IBM Plex Sans',ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif" dominant-baseline="middle" fill="#191714">

  <rect x="24" y="24" width="460" height="252" rx="12" fill="#ffffff" stroke="#e8e2d8"/>

  <text x="44" y="50" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#94897a">CAMPAIGN</text>
  <rect x="316" y="40" width="148" height="20" rx="5" fill="#f3eee4"/>
  <text x="390" y="50" font-size="9.5" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#5f594f" text-anchor="middle">last write &lt;14:06&gt; UTC</text>
  <line x1="44" y1="68" x2="464" y2="68" stroke="#eee7da"/>

  <g font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="600" fill="#1f4fd8">
    <text x="44" y="94">&lt;8&gt;<tspan fill="#191714">/</tspan>&lt;12&gt;</text>
    <text x="264" y="94">&lt;96&gt;</text>
    <text x="44" y="152">&lt;41&gt;</text>
    <text x="264" y="152" fill="#3f6b25">&lt;3&gt;</text>
  </g>
  <g font-size="10" font-weight="600" letter-spacing="0.85" fill="#94897a">
    <text x="44" y="114">ITERATIONS</text>
    <text x="264" y="114">PROPOSED</text>
    <text x="44" y="172">SCORED</text>
    <text x="264" y="172">HITS · &lt;1&gt; REDISCOVERY</text>
  </g>

  <rect x="44" y="198" width="420" height="5" rx="2.5" fill="#eee7da"/>
  <rect x="44" y="198" width="172" height="5" rx="2.5" fill="#1f4fd8"/>
  <g font-size="10" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace">
    <text x="44" y="220" fill="#94897a">relaxations &lt;41&gt; / &lt;100&gt;</text>
    <text x="464" y="220" fill="#a03415" text-anchor="end">errors &lt;2&gt;</text>
  </g>

  <!-- annotations -->
  <g stroke="#ddd5c7" stroke-dasharray="3 3">
    <line x1="486" y1="50" x2="506" y2="50"/>
    <line x1="486" y1="100" x2="506" y2="100"/>
    <line x1="486" y1="160" x2="506" y2="160"/>
    <line x1="486" y1="205" x2="506" y2="205"/>
  </g>
  <g font-size="10.5" fill="#5f594f">
    <text x="514" y="50">chip = last row written to the campaign DB</text>
    <text x="514" y="93">20px mono, tabular-nums; 10px uppercase</text>
    <text x="514" y="108">caption below. Every count names its</text>
    <text x="514" y="123">denominator — 8 / 12, never a bare 8.</text>
    <text x="514" y="153">HITS is the one number on the page that</text>
    <text x="514" y="168">means success, so it is the one that gets</text>
    <text x="514" y="183">colour (--hit green, only when &gt; 0).</text>
    <text x="514" y="213">5px track, --primary fill: relaxations are</text>
    <text x="514" y="228">the real compute cost, so the budget is</text>
    <text x="514" y="243">drawn as a gauge instead of buried in text.</text>
  </g>
</g>
</svg>
