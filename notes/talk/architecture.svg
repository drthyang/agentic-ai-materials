<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="825" viewBox="0 0 1600 825" font-family="'Avenir Next', Avenir, 'Nunito Sans', 'Helvetica Neue', sans-serif">
  <title>Athanor architecture: only the chooser differs</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 L2,5 z" fill="#53585f"/>
    </marker>
  </defs>

  <rect id="background" width="1600" height="825" fill="#fffef5"/>

  <!-- Shared panel: solid, so the dash means only "no LLM" -->
  <rect x="362" y="205" width="1176" height="220" rx="18" fill="#f5f3e8" stroke="#d9d5c6" stroke-width="1.5"/>

  <g fill="none" stroke="#53585f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- mission applies to the shared pipeline -->
    <path d="M 1250 96 V 196" marker-end="url(#ah)"/>
    <!-- both choosers enter the same filters; baseline path dashed -->
    <path d="M 300 220 H 322 Q 345 220 345 243 V 345" stroke-dasharray="9 7"/>
    <path d="M 300 470 H 322 Q 345 470 345 447 V 345"/>
    <path d="M 345 345 H 381" marker-end="url(#ah)"/>
    <!-- baselines go straight to relaxation -->
    <path d="M 618 345 H 980" stroke-dasharray="9 7" marker-end="url(#ah)"/>
    <!-- agent candidates detour through the critic -->
    <path d="M 500 403 V 495 Q 500 520 525 520 H 671" marker-end="url(#ah)"/>
    <path d="M 928 520 H 1075 Q 1100 520 1100 495 V 404" marker-end="url(#ah)"/>
    <!-- relax -> score -> ledger -->
    <path d="M 1218 345 H 1279" marker-end="url(#ah)"/>
    <path d="M 1400 403 V 611" marker-end="url(#ah)"/>
    <!-- the notebook feeds the proposer's next iteration -->
    <path d="M 1400 710 V 715 Q 1400 740 1375 740 H 205 Q 180 740 180 715 V 531" marker-end="url(#ah)"/>
  </g>

  <!-- Mission -->
  <rect x="1115" y="24" width="270" height="72" rx="14" fill="#efede2" stroke="#929292" stroke-width="2"/>
  <text x="1250" y="60" text-anchor="middle" dominant-baseline="central" font-size="30" font-weight="500" fill="#53585f">Mission YAML</text>
  <text font-size="21" font-weight="600" fill="#53585f" text-anchor="end">
    <tspan x="1090" y="52">Gap 1.1–1.7 eV · hull ≤ 0.05 eV/atom</tspan>
    <tspan x="1090" y="80">5 iterations × 20 relaxations</tspan>
  </text>

  <!-- Choosers -->
  <text font-size="21" font-weight="600" fill="#53585f" text-anchor="middle">
    <tspan x="180" y="118">Random · similarity</tspan>
    <tspan x="180" y="144">BayesOpt (GP + EI)</tspan>
  </text>
  <rect x="60" y="170" width="240" height="100" rx="14" fill="#ffffff" stroke="#929292" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="180" y="220" text-anchor="middle" dominant-baseline="central" font-size="30" font-weight="500" fill="#708790">Baselines</text>

  <text font-size="21" font-weight="600" fill="#53585f" text-anchor="middle">
    <tspan x="180" y="368">qwen3:32b (local)</tspan>
    <tspan x="180" y="394">or Claude Sonnet 5.5</tspan>
  </text>
  <rect x="60" y="420" width="240" height="100" rx="14" fill="#ffffff" stroke="#929292" stroke-width="2"/>
  <text x="180" y="470" text-anchor="middle" dominant-baseline="central" font-size="30" font-weight="500" fill="#708790">LLM proposer</text>

  <!-- Shared pipeline -->
  <text x="364" y="150" font-size="27" font-weight="600" fill="#e08425">Only the chooser differs</text>
  <text x="364" y="184" font-size="21" font-weight="600" fill="#53585f">Shared by every arm · budgets enforced in code</text>

  <text font-size="21" font-weight="600" fill="#53585f" text-anchor="middle">
    <tspan x="500" y="245">SMACT charge balance</tspan>
    <tspan x="500" y="271">new to Materials Project</tspan>
    <tspan x="1100" y="245">≤ 20 per iteration,</tspan>
    <tspan x="1100" y="271">counted in code</tspan>
    <tspan x="1400" y="245">Materials Project hull,</tspan>
    <tspan x="1400" y="271">MEGNet HSE gap</tspan>
    <tspan x="800" y="327">Baselines skip the critic</tspan>
  </text>

  <rect x="390" y="295" width="220" height="100" rx="14" fill="#b8898b" stroke="#929292" stroke-width="2"/>
  <text x="500" y="345" text-anchor="middle" dominant-baseline="central" font-size="30" font-weight="500" fill="#000000">Filters</text>

  <rect x="990" y="295" width="220" height="100" rx="14" fill="#53585f" stroke="#929292" stroke-width="2"/>
  <text x="1100" y="345" text-anchor="middle" dominant-baseline="central" font-size="30" font-weight="500" fill="#ffffff">CHGNet relax</text>

  <rect x="1290" y="295" width="220" height="100" rx="14" fill="#53585f" stroke="#929292" stroke-width="2"/>
  <text x="1400" y="345" text-anchor="middle" dominant-baseline="central" font-size="30" font-weight="500" fill="#ffffff">Hull &amp; gap</text>

  <!-- Critic: agent arm only, the second LLM -->
  <rect x="680" y="470" width="240" height="100" rx="14" fill="#b8898b" stroke="#929292" stroke-width="2"/>
  <text x="800" y="503" text-anchor="middle" dominant-baseline="central" font-size="30" font-weight="500" fill="#000000">Critic gate</text>
  <text x="800" y="541" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#000000">2nd LLM · gemma4:26b</text>
  <text x="800" y="602" text-anchor="middle" font-size="21" font-weight="600" fill="#53585f">Agent arm only · vetoes cost no budget</text>

  <!-- Record -->
  <rect x="1250" y="620" width="300" height="90" rx="14" fill="#efede2" stroke="#929292" stroke-width="2"/>
  <text x="1400" y="665" text-anchor="middle" dominant-baseline="central" font-size="30" font-weight="500" fill="#53585f">Ledger + notebook</text>
  <text font-size="21" font-weight="600" fill="#53585f" text-anchor="end">
    <tspan x="1225" y="656">Every proposal, veto and score</tspan>
    <tspan x="1225" y="684">One hit rule for every arm</tspan>
  </text>
  <text font-size="21" font-weight="600" fill="#53585f">
    <tspan x="205" y="632">Next iteration</tspan>
    <tspan x="205" y="658">reads the notebook</tspan>
  </text>

  <!-- Legend -->
  <g font-size="20" font-weight="600" fill="#53585f">
    <rect x="50" y="775" width="40" height="30" rx="8" fill="#ffffff" stroke="#929292" stroke-width="2"/>
    <text x="102" y="790" dominant-baseline="central">Agent (LLM)</text>
    <rect x="270" y="775" width="40" height="30" rx="8" fill="#ffffff" stroke="#929292" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="322" y="790" dominant-baseline="central">Control (no LLM)</text>
    <rect x="540" y="775" width="40" height="30" rx="8" fill="#b8898b" stroke="#929292" stroke-width="2"/>
    <text x="592" y="790" dominant-baseline="central">Guardrail (gate before compute)</text>
    <rect x="965" y="775" width="40" height="30" rx="8" fill="#53585f" stroke="#929292" stroke-width="2"/>
    <text x="1017" y="790" dominant-baseline="central">Physics / numerics</text>
    <rect x="1265" y="775" width="40" height="30" rx="8" fill="#efede2" stroke="#929292" stroke-width="2"/>
    <text x="1317" y="790" dominant-baseline="central">Config &amp; record</text>
  </g>
</svg>
